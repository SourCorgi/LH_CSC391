<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fishbowl</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script>
//Fishbowl
AFRAME.registerComponent('boid-fish', {
  schema: { species: { default: 'orange' }, speed: { default: 0.5 }, radius: { default: 0.65 } },
  init: function () {
    const V3 = AFRAME.THREE.Vector3;
    this.velocity = new V3(Math.random()-0.5,(Math.random()-0.5)*0.2,Math.random()-0.5)
      .normalize().multiplyScalar(this.data.speed);
    this.center = new V3(0,1.2,0);
    this.surfaceY=1.8;
    this.tailEl = this.el.querySelector('.fish-tail');
    this.fishes = this.el.parentEl ? this.el.parentEl.querySelectorAll('[boid-fish]') : [];
    this.maxTurn = 0.05;
    this.inspectTimer=Math.random()*5000;
  },
  tick: function(time, delta) {
    const V3 = AFRAME.THREE.Vector3;
    const pos = this.el.object3D.position;
    const cohesion = new V3(); 
    const alignment = new V3(); 
    const separation = new V3();
    let neighborCount = 0;
    this.fishes.forEach(fish => {
      if (fish === this.el) return;
      const fPos = fish.object3D.position;
      const dist = pos.distanceTo(fPos);
      if (dist < 0.2) separation.add(pos.clone().sub(fPos).divideScalar(dist));
      if (dist < 0.5) {
        alignment.add(fish.components['boid-fish'].velocity);
        cohesion.add(fPos);
        neighborCount++;
      }
    });
    if (neighborCount > 0) {
      cohesion.divideScalar(neighborCount).sub(pos).multiplyScalar(0.02);
      alignment.divideScalar(neighborCount).normalize().multiplyScalar(0.05);
    }
    const toCenter = this.center.clone().sub(pos).multiplyScalar(0.01);
    const random = new V3((Math.random()-0.5)*0.01,(Math.random()-0.5)*0.005,(Math.random()-0.5)*0.01);
    this.velocity.add(cohesion).add(alignment).add(separation).add(toCenter).add(random);

    if (this.velocity.length() > this.data.speed) this.velocity.setLength(this.data.speed);
//Avoidance to the treasure chest
    const chest=new V3(0.2,1,0.3);
    const chestRadius=0.35;
    const distChest=pos.distanceTo(chest);
    if(distChest<chestRadius){
      const avoid=pos.clone().sub(chest).normalize().multiplyScalar(0.03);
      this.velocity.add(avoid);
    }
    //Fish interact with chest
    this.inspectTimer+=delta;
    if(this.inspectTimer>8000){
      this.inspectTimer=0;
      if(Math.random()<0.3){
        const inspect=chest.clone().sub(pos).normalize().multiplyScalar(0.02);
        this.velocity.add(inspect);
    }
    }
    //Fishbowl Boundary
    if(pos.distanceTo(this.center)>this.data.radius){
      const toC=this.center.clone().sub(pos).normalize();
      this.velocity.lerp(toC.multiplyScalar(this.data.speed),0.2);
      pos.add(toC.clone().multiplyScalar(0.01));
    }
    //Water Boundary
    if(pos.y>this.surfaceY){
    pos.y=this.surfaceY;
    this.velocity.y=Math.abs(this.velocity.y);
    }
    //Table Boundary
    const minY=1.0;
    if(pos.y<minY){
      pos.y=minY;
    if(this.velocity.y<0) this.velocity.y=Math.abs(this.velocity.y)*0.5;
    }
    pos.add(this.velocity.clone().multiplyScalar(delta/1000));
    const targetRotY = Math.atan2(this.velocity.x, this.velocity.z);
    const targetRotX = Math.atan2(this.velocity.y, this.velocity.z);
    this.el.object3D.rotation.y += (targetRotY - this.el.object3D.rotation.y) * this.maxTurn;
    this.el.object3D.rotation.x += (targetRotX - this.el.object3D.rotation.x) * this.maxTurn;
    //Tail Animation
    if (this.tailEl && this.tailEl.object3D) {
      this.tailEl.object3D.rotation.z = Math.sin(time / 150) * 0.5;
    }
  }
});
//FishSpawner
AFRAME.registerComponent('fish-spawner',{
  schema:{count:{default:50},species:{default:'orange'},speed:{default:0.5}},
  init:function(){
    for(let i=0;i<this.data.count;i++){
      const fish=document.createElement('a-entity');
      fish.setAttribute('boid-fish',`species:${this.data.species};speed:${this.data.speed}`);
      fish.setAttribute('position',`${Math.random()*1.2-0.6} ${1+Math.random()*0.4} ${Math.random()*1.2-0.6}`);
      const body=document.createElement('a-sphere');
      let radius=0.03; if(this.data.species==='blue') radius=0.025; if(this.data.species==='purple') radius=0.03;
      body.setAttribute('radius',radius);
      body.setAttribute('color',this.data.species==='orange'?'#ffaa33':this.data.species==='blue'?'#33aaff':'#ab47bc');
      fish.appendChild(body);
      const tail=document.createElement('a-cone');
      let tailH=0.04; if(this.data.species==='blue') tailH=0.035; if(this.data.species==='purple') tailH=0.04;
      tail.setAttribute('radius-bottom',0.02);
      tail.setAttribute('radius-top',0);
      tail.setAttribute('height',tailH);
      tail.setAttribute('rotation','0 0 90');
      tail.setAttribute('position','-0.035 0 0');
      tail.setAttribute('color',body.getAttribute('color'));
      //Swim Animation
      tail.setAttribute('class','fish-tail');
      fish.appendChild(tail);
      const eye=document.createElement('a-sphere');
      eye.setAttribute('radius',0.005);
      eye.setAttribute('color','#000000');
      eye.setAttribute('position','0.015 0.01 0.02');
      fish.appendChild(eye);

      this.el.appendChild(fish);
    }
  }
});
//Cat Behavior
AFRAME.registerComponent('cat-roamer',{
  schema:{radius:{default:2},speed:{default:0.5},pauseTime:{default:2000}},
  init:function(){
    this.angle = 0;
    this.pauseTimer = 0;
    this.pausing = false;
  },
  tick:function(time, delta){
    if(this.pausing){
      this.pauseTimer+=delta;
      if(this.pauseTimer>this.data.pauseTime){
        this.pausing=false;
        this.pauseTimer=0;
      }
    } else {
      this.angle += this.data.speed*delta/1000;
      const x = Math.cos(this.angle)*this.data.radius;
      const z = Math.sin(this.angle)*this.data.radius;
      this.el.object3D.position.set(x,0.075,z);
      const lookAt = new AFRAME.THREE.Vector3(0,0.075,0);
      if(Math.random()<0.003){
        this.pausing=true;
        this.el.object3D.lookAt(new AFRAME.THREE.Vector3(0,1.2,0));
      } else {
        this.el.object3D.lookAt(lookAt);
      }
    }
  }
});
</script>
</head>
<body>
<a-scene shadow="type:pcfsoft" background="color:#cfefff">
  <!-- Sky -->
  <a-sky color="#cfefff"></a-sky>
  <!-- Camera -->
  <a-entity position="0 2.5 6">
    <a-camera wasd-controls-enabled="true"></a-camera>
  </a-entity>
  <!-- Lighting -->
  <a-light type="ambient" intensity="0.6"></a-light>
  <a-light type="directional" position="3 6 3" intensity="1" cast-shadow="true"></a-light>
  <!-- Floor -->
  <a-plane rotation="-90 0 0" width="6" height="6" color="#dcd0c0" shadow="receive:true"></a-plane>
  <!-- Rug -->
  <a-plane position="0 0.01 0" rotation="-90 0 0" width="2" height="1" color="#ffddaa" shadow="receive:true"></a-plane>
  <!-- Walls -->
  <a-box position="0 1.5 -3" depth="0.1" height="3" width="6" color="#f2e0d0" shadow="receive:true"></a-box>
  <a-box position="-3 1.5 0" rotation="0 90 0" depth="0.1" height="3" width="6" color="#f2d0d0" shadow="receive:true"></a-box>
  <a-box position="3 1.5 0" rotation="0 90 0" depth="0.1" height="3" width="6" color="#f2d0d0" shadow="receive:true"></a-box>
  <!-- Window -->
  <a-box position="0 1.5 -2.95" width="2" height="1.5" depth="0.05" color="#88ccff" opacity="0.6" shadow="false"></a-box>
  <!-- Table -->
  <a-box position="0 0.85 0" width="1.5" depth="1.5" height="0.1" color="#8B5A2B" shadow="receive:true"></a-box>
  <a-box position="-0.65 0.4 -0.65" width="0.1" depth="0.1" height="0.7" color="#5A3A1A" shadow="receive:true"></a-box>
  <a-box position="0.65 0.4 -0.65" width="0.1" depth="0.1" height="0.7" color="#5A3A1A" shadow="receive:true"></a-box>
  <a-box position="-0.65 0.4 0.65" width="0.1" depth="0.1" height="0.7" color="#5A3A1A" shadow="receive:true"></a-box>
  <a-box position="0.65 0.4 0.65" width="0.1" depth="0.1" height="0.7" color="#5A3A1A" shadow="receive:true"></a-box>
  <!-- Fishbowl -->
  <a-sphere radius="0.65" position="0 1.2 0" material="color:white;transparent:true;opacity:0.15;metalness:0.9;roughness:0.05"></a-sphere>
  <a-sphere radius="0.6" position="0 1.2 0" material="color:#66ccff;transparent:true;opacity:0.35"></a-sphere>
  <a-cylinder radius="0.55" height="0.08" position="0 0.85 0" color="#e6d3a3"></a-cylinder>
  <!-- Plants -->
  <a-cone radius-bottom="0.025" radius-top="0.01" height="0.2" position="-0.15 0.95 0.1" color="#2ecc71" sway="speed:1.2;amount:0.05"></a-cone>
 <!-- Treasure Chest -->
<a-entity position="0.2 1 0.3">
  <!-- Chest Base -->
  <a-box
    width="0.3"
    height="0.25"
    depth="0.35"
    color="#8B5A2B"
    static-body>
  </a-box>
  <!--Open/Close Lid -->
  <a-box
    position="0 0.175 0"
    width="0.3"
    height="0.1"
    depth="0.35"
    color="#A0522D"
    bubble-generator
    static-body
    animation="property: rotation; from: 0 0 0; to: -60 0 0; dir: alternate; loop: true; dur: 2000">
  </a-box>
</a-entity>
  <!-- Fish Schools -->
  <a-entity fish-spawner="count:25;species:orange;speed:0.5"></a-entity>
  <a-entity fish-spawner="count:20;species:blue;speed:0.55"></a-entity>
  <a-entity fish-spawner="count:15;species:purple;speed:0.45"></a-entity>
  <!-- Cat -->
  <a-entity cat-roamer>
    <!-- Body -->
    <a-box width="0.2" height="0.1" depth="0.45" color="#555"></a-box>
    <!-- Head -->
    <a-box width="0.15" height="0.1" depth="0.15" position="0 0 0.3" color="#555"></a-box>
    <!-- Legs -->
    <a-box width="0.05" height="0.08" depth="0.05" position="0.075 -0.05 0.15" color="#555"></a-box>
    <a-box width="0.05" height="0.08" depth="0.05" position="-0.075 -0.05 0.15" color="#555"></a-box>
    <a-box width="0.05" height="0.08" depth="0.05" position="0.075 -0.05 -0.15" color="#555"></a-box>
    <a-box width="0.05" height="0.08" depth="0.05" position="-0.075 -0.05 -0.15" color="#555"></a-box>
    <!-- Tail -->
    <a-box width="0.05" height="0.05" depth="0.2" position="0 0 -0.35" color="#555"></a-box>
    <!-- Ears -->
    <a-cone radius-bottom="0.025" radius-top="0" height="0.08" position="0.05 0.05 0.38" rotation="0 0 20" color="#555"></a-cone>
    <a-cone radius-bottom="0.025" radius-top="0" height="0.08" position="-0.05 0.05 0.38" rotation="0 0 -20" color="#555"></a-cone>
  </a-entity>
</a-scene>
</body>
</html>
